; ============================================================================
;  ACZPropNav 扩展段 / ACZPropNav extension sections (optional)
;  留空或删掉都不影响上面 AC8 风格的配置。
;  Optional: remove them and the AC8-style config above still works.
; ============================================================================
;
; [runtime]
;     LogLevel              =         ; 留空/不写 = 1（推荐，几乎不产生日志）
;                                      ; 0 = 完全不写日志文件
;                                      ; 1 = 只记启动、钩子状态、警告、错误（默认）
;                                      ; 2 = 详细：每 2 秒一行统计 + 每条修正明细，
;                                      ;     只在排查问题时开，平时不要开
;                                      ; ★ 报 issue 时请改成 2 复现一次，附上两个 .log
;     DryRun                = 0        ; 1 = 只检测、只写日志，不动游戏内存
;     Probe                 = 0        ; 1 = 深度探测（RTTI/导弹实例/数值邻域）写进 key.log
;     RingSurvey            = 0        ; 1 = 只读观察导弹尾迹环(EFF_MIS_POSDIR)的写入点，
;                                      ;     用来定位普通 MSL 的每帧推进函数（诊断用；
;                                      ;     结论是这条路不通，见 docs/HANDOFF.md；
;                                      ;     需同时设 LogLevel=2 才看得到 RING 行）
;     TickHz                = 120      ; 引导接管频率
;     RequireVerifiedOffsets= 1        ; 1 = 没有验证过结构就不写内存（安全默认）
;     GuidanceOverride      = 1        ; 1 = 找到导弹实体后真正施加比例引导
;     ForceOffsets          = 0        ; 1 = 无条件相信下面四个手工偏移
;     EntityPosOffset       =          ; 手工校准：导弹位置向量偏移（如 0x80）
;     EntityVelOffset       =          ; 手工校准：导弹速度向量偏移
;     TargetPosOffset       =          ; 手工校准：目标位置向量偏移
;     TargetVelOffset       =          ; 手工校准：目标速度向量偏移
;     PnGain                = 4        ; 导航常数 N：经典 PN 取 4；调大更早转弯，调小更平滑
;     TerminalZone          = 0        ; 0 = 全程比例引导（默认）。>0 = 进入该半径（米）后
;                                      ;     把最后进场交还原版制导（仅用于 A/B 对比）
;     LeadScale             = 260      ; 旧路径专用：静态参数模式下给引擎 lead 加多少帧
;     LeadMode              = add      ; 旧路径专用：add / blend / absolute
;     HookRva               =          ; 手工校准：导弹调度器在 exe 里的偏移（十进制或 0x）
;     HookSignature         =          ; 或填字节签名（推荐），例如 ACZ 的导弹调度器：
;                                       ; 48 89 5C 24 08 48 89 6C 24 10 48 89 74 24 18 57 48 83 EC 40
;     HookArgIndex          = 1        ; 1 = 只有 this（调度器用 1），2 = this + float dt
;     EntityOverride        = 0        ; 1 = 不装钩子，直接写导弹实体（实验性）
;
; [vanilla]
;     ; 扫描器靠"原版数值"在内存里找参数表。内置表见 docs/VANILLA.md；
;     ; 如果游戏更新后内置值对不上，在这里填正确的原版值即可。
;     ; 内置值（a.arc: data/mis/mpl/*.wpb）：
;     ;     mis  (玩家 MSL) : lead 40   startAng 90  range 3000  scope 1600
;     ;     misf (僚机 MSL) : lead 80   startAng 60  range 2000  scope 1600
;     ;     misf2(僚机 2)   : lead 28   startAng 30  range 2000  scope 1600
;     ; The scanner locates parameter tables by their vanilla values (built-in
;     ; table in docs/VANILLA.md). If a game update changes them, list the real
;     ; values here - same block syntax as [player].
;     msl = {
;         HomingForesightAmount = 40      ; = lead
;         MaxHomingAngle        = 90      ; = startAng
;         LifeTime              = 3000    ; = range (m)
;         LockonRange           = 1600    ; = scope (m)
;     }
;     misf = {
;         HomingForesightAmount = 80
;         MaxHomingAngle        = 60
;         LifeTime              = 2000
;         LockonRange           = 1600
;     }
