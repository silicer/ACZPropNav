; ============================================================================
;  ACZPropNav — 配置 / Configuration
;  ACE COMBAT ZERO: THE BELKAN WAR (Steam) — 比例引导导弹 / proportional-nav missiles
; ============================================================================
;
;  语法与 AC8PropNav 完全相同：每个型号都列好了属性名 —— 你只需要改数字。
;  等号后留空 = 保持原版。
;
;  Syntax is identical to the AC8 mod: names are pre-filled, just edit the
;  numbers. Blank = keep vanilla.
;
; ============================================================================
;  属性 / Properties
; ============================================================================
;
;  HomingForesightAmount —— 制导律混合系数（主参数）
;      0    = 纯追踪：每帧朝目标当前位置转，但转角仍受 MaxRotationAngle 限制
;             （= 用本模组的限速重跑原版追尾逻辑，可直接当作 A/B 基线）
;      1.0  = 完整比例引导（真 PN：转弯角速度 = N × 视线角速度 λ̇，N 见 PnGain）
;      中间值 = 两个需求各按自身份额、在同一个每帧转角预算内合成（不会互相抵消）
;      · 留空（不写这一行）= 完全交还原版机动，本模组不接管该型号。
;        想彻底关掉接管请用 [runtime] GuidanceOverride = 0。
;      · 普通 MSL 与特殊武器共用这一语义；特殊武器由 0x90510 积分器路径实现，
;        普通 MSL 由 0x13ECA0 后置钩子实现（见 docs/MSL_PN.md）。
;
;  HomingForesightAmount - guidance-law blend (main parameter)
;      0    = pure pursuit: turn toward the target's current position each frame, still
;             capped by MaxRotationAngle (the vanilla chase re-implemented by this mod,
;             i.e. a usable A/B baseline)
;      1.0  = full proportional navigation (true PN: turn rate = N x LOS rate lambda-dot,
;             N from PnGain)
;      in between = both demands compose within one per-frame turn budget (they do not
;             cancel each other)
;      * Blank (line omitted) = that model is left entirely vanilla, the mod does not
;        take it over. To switch the whole mod off use [runtime] GuidanceOverride = 0.
;
; ----------------------------------------------------------------------------
;
;  MaxHomingAngle —— 导引头视场/起始角，单位度
;      敌机必须落在这个角度以内才会被跟踪。
;      超出视场就失去制导 —— 哪怕你已经锁定了它。
;      ★ 普通 MSL：这是"半角"，90 = ±90°（180° 全视场）；
;        由原版制导函数在旋转前判断，脱锁只是不再转向、不清除目标。
;
;  MaxHomingAngle - seeker cone / start angle, in degrees
;      A target outside this cone is NOT tracked, even if you have lock on it.
;      ★ For the plain MSL this is a HALF-angle: 90 = +/-90 deg (180 deg total FOV),
;        checked by the vanilla guidance before it rotates; out-of-cone only stops
;        the rotation, it does not clear the target.
;
; ----------------------------------------------------------------------------
;
;  MaxRotationAngle —— 转向速率，度/秒
;      调大 = 拐得更急、更难被甩掉；调小 = 更笨、更容易甩。
;      留空 = 180。真实单位就是"度/秒"：每帧最大转角 = MaxRotationAngle ÷ 引擎帧率
;      （本版本 60），所以填 90 真的就是 90°/s。超过 360 基本等于瞬间转向。
;      ★ ACZ 的武器数据里没有"转向速率"字段（原版用 lead 当限速），
;        所以这一项只在比例引导接管时生效。
;
;  MaxRotationAngle - turn rate, in degrees per second
;      Higher turns harder and is harder to dodge; lower is clumsier.
;      Blank = 180. The unit really is degrees/second: max turn per frame is
;      MaxRotationAngle / engine fps (60 in this build), so 90 means 90 deg/s.
;      Above 360 it is effectively instant.
;      ★ ACZ has no turn-rate field (vanilla clamps with `lead` instead), so this
;        only acts while proportional navigation is in control.
;
; ----------------------------------------------------------------------------
;
;  LifeTime —— 射程/存活时间。它就是"射程"的直接控制量
;      射程 ≈ LifeTime × 速度。
;      ACZ 原版：玩家 MSL 3000 m（速度 1000 m/s），僚机 2000 m。
;
;  LifeTime - range / lifetime; this is what sets the reach
;      ACZ vanilla: player MSL 3000 m (speed 1000 m/s), wingman 2000 m.
;
; ----------------------------------------------------------------------------
;
;  LockonRange —— 锁定距离，单位米（只对玩家有效）
;      改的是你 HUD 上那个锁定圈。
;      ★ 改完要**切一次武器**才生效（进关卡后切一次即可）。
;
;  LockonRange - lock-on range in metres (player only)
;      This is the lock ring on your HUD.
;      ★ Takes effect after one weapon switch (once per level).
;
; ============================================================================
;  规则 / Rules
; ============================================================================
;
;  · 只改你填了数字的项；留空 = 保持原版
;  · 型号键按长度降序匹配 ⇒ 写 4aam 不会被 aam 抢走
;  · 旧写法 msl = 0.8 仍然有效（等价于只设比例制导）
;  · 型号键可以自由增删：键会被当作"型号名里的子串"去匹配游戏里的武器
;
;  · Only entries with a number are changed; blank = keep vanilla.
;  · Keys match longest-first, so 4aam is not stolen by aam.
;  · The old form msl = 0.8 still works (same as setting only the lead).
;  · Model keys are free-form: a key is matched as a substring of the game's
;    weapon identifiers, so you can add new ones.
;
; ============================================================================


; ----------------------------------------------------------------------------
;  玩家武器 / Player weapons
; ----------------------------------------------------------------------------
;
;  出厂只设比例制导，其余四项留空 = 保持原版。
;  理由：各型号的原作值差别很大，写死一个数会悄悄改掉所有型号的手感。
;
;  Factory default sets only the lead. The other four are left blank on purpose -
;  vanilla values differ a lot per missile, so hard-coding one number would
;  silently change every missile's feel.
;
;  想调成"几乎甩不掉"，试这两个：
;      MaxHomingAngle   = 360      （单这一项就已经很强）
;      MaxRotationAngle = 60
;
;  For near-unavoidable missiles, try:
;      MaxHomingAngle   = 360      (this alone is already strong)
;      MaxRotationAngle = 60
;
; ----------------------------------------------------------------------------
[player]

msl = {
    HomingForesightAmount = 0.7
    LockonRange           =
    MaxRotationAngle      =
    MaxHomingAngle        =
    LifeTime              =
}

qaam = {
    HomingForesightAmount = 1.0
    LockonRange           =
    MaxRotationAngle      =
    MaxHomingAngle        =
    LifeTime              =
}

laam = {
    HomingForesightAmount = 0.85
    LockonRange           =
    MaxRotationAngle      =
    MaxHomingAngle        =
    LifeTime              =
}

hvaa = {
