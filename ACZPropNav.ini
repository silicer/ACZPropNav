; ----------------------------------------------------------------------------
;  敌方武器 / Enemy weapons
; ----------------------------------------------------------------------------
;
;  出厂只给敌方普通导弹一点提前量（0.3），明显弱于玩家 ——
;  你能甩掉敌弹，敌机比较难甩掉你的弹。
;
;  ★ 想让敌方保持原版：把整个 [enemy] 段注释掉。
;
;  A small lead (0.3) for enemy missiles only, clearly weaker than the
;  player's, so you can still dodge them.
;
;  ★ To keep enemies vanilla, comment out the whole [enemy] section.
;
; ----------------------------------------------------------------------------
[enemy]

msl = {
    HomingForesightAmount = 0.3
    MaxRotationAngle      =
    MaxHomingAngle        =
    LifeTime              =
}

qaam = {
    HomingForesightAmount = 0.45
    MaxRotationAngle      =
    MaxHomingAngle        =
    LifeTime              =
}

laam = {
    HomingForesightAmount = 0.35
    MaxRotationAngle      =
    MaxHomingAngle        =
    LifeTime              =
}

saam = {
    HomingForesightAmount = 0.3
    MaxRotationAngle      =
    MaxHomingAngle        =
    LifeTime              =
}

4aam = {
